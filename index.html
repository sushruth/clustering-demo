<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clustering & Grouping Metrics Visual Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="antialiased select-none">

  <main class="stage">
    <div class="canvas-wrap">
      <canvas id="clusterCanvas" class="cursor-grab active:cursor-grabbing"></canvas>
      <p class="tip">Drag a node.</p>
    </div>

    <aside class="side">
      <nav id="terms" class="terms"></nav>

      <section class="def">
        <h1 id="term-name"></h1>
        <p id="term-text"></p>
        <p id="term-num" class="mono"></p>
      </section>

      <nav class="presets">
        <button class="txt" onclick="loadPreset('wellSeparated')">Ideal Isolated</button>
        <button class="txt" onclick="loadPreset('highCoupling')">High Coupling</button>
        <button class="txt" onclick="loadPreset('diffuse')">Overlapping</button>
        <button class="txt" onclick="loadPreset('outlierSkew')">Outlier Skew</button>
        <button class="txt" onclick="loadPreset('densityChains')">Density Chains</button>
      </nav>

      <section class="play">
        <div class="sliders">
          <div class="ctl c1" data-for="cohesion"><div class="row"><span class="lbl2">Cohesion</span><span id="val-cohesion" class="mono val">75%</span></div><input id="slider-cohesion" type="range" min="10" max="150" value="75"></div>
          <div class="ctl c2" data-for="separation"><div class="row"><span class="lbl2">Separation</span><span id="val-separation" class="mono val">180px</span></div><input id="slider-separation" type="range" min="40" max="360" value="180"></div>
          <div class="ctl c4" data-for="coupling"><div class="row"><span class="lbl2">Coupling</span><span id="val-coupling" class="mono val">3 edges</span></div><input id="slider-coupling" type="range" min="0" max="150" value="3"></div>
          <div class="ctl c3" data-for="k"><div class="row"><span class="lbl2">Clusters (K)</span><span id="val-clusters" class="mono val">3 groups</span></div><input id="slider-clusters" type="range" min="2" max="8" value="3"></div>
          <div class="ctl c5" data-for="epsilon"><div class="row"><span class="lbl2">Reachability &epsilon;</span><span id="val-epsilon" class="mono val">45px</span></div><input id="slider-epsilon" type="range" min="20" max="100" value="45"></div>
        </div>
        <button class="txt reset" onclick="resetSliders()">Reset defaults</button>
      </section>

      <div class="actions">
        <button id="btn-tree" class="txt" onclick="toggleTree()">Tree view</button>
        <button id="btn-identify" class="txt" onclick="toggleIdentify()">Identify clusters</button>
        <button class="txt" onclick="reseedGraph()">Reseed</button>
        <button class="txt" onclick="addRandomOutlier()">+ Outlier</button>
        <button id="btn-elbow" class="txt" onclick="toggleElbow()">Elbow</button>
      </div>

      <section id="elbow" class="elbow" hidden>
        <canvas id="elbowCanvas"></canvas>
        <p id="elbow-hint" class="hint">Adding clusters stops helping fast here.</p>
      </section>
    </aside>
  </main>

  <div class="legacy" hidden>
    <span id="node-count"></span><span id="cluster-count-label"></span>
    <div id="inspector-pill" class="hidden"><span id="inspect-id"></span><span id="inspect-a"></span><span id="inspect-b"></span><span id="inspect-s"></span></div>
    <span id="metric-cohesion"></span><span id="metric-separation"></span><span id="metric-silhouette"></span><span id="metric-cut"></span><span id="metric-conductance"></span><span id="metric-db"></span><span id="metric-dunn"></span><span id="metric-inertia"></span>
    <input type="checkbox" id="layer-enclosures" checked><input type="checkbox" id="layer-intra-edges" checked><input type="checkbox" id="layer-inter-edges" checked>
  </div>

  <script src="js/state.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/render.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/terms.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/elbow.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
